# CI == exactly the local gate (compile, ruff-critical, offline pytest,
# secret-scan). Runs on Windows because that is the target platform.
name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m funkatlas.gate
